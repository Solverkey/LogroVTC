<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <style>
      .bg { fill: #A53776; }
      .text { fill: #FFFFFF; font-family: 'Arial', sans-serif; font-weight: 700; }
      .logro { font-size: 48px; letter-spacing: -1.5px; }
      .vtc { font-size: 72px; letter-spacing: 0.5px; }
    </style>
  </defs>

  <!-- Fondo con bordes redondeados (iOS requiere esquinas más redondeadas) -->
  <rect class="bg" width="180" height="180" rx="40" ry="40"/>

  <!-- Texto "Logro" -->
  <text class="text logro" x="90" y="75" text-anchor="middle">Logro</text>

  <!-- Texto "VTC" -->
  <text class="text vtc" x="90" y="135" text-anchor="middle">VTC</text>
</svg>
